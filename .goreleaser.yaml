version: 2

project_name: agentv

builds:
  - id: agentv
    main: ./cmd/agentv
    binary: agentv

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - darwin

    goarch:
      - amd64
      - arm64

    flags:
      - -trimpath

    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz

    name_template: "agentv_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
