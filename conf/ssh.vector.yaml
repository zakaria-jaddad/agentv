data_dir: "/tmp/agentv"

# SOURCES
sources:
  postgres_logs:
    type: "docker_logs"
    include_containers:
      - "postgres"

transforms:
  remap_postgres_logs:
    inputs:
      - postgres_logs
    type: remap
    source: |
      # Strip ANSI escape sequences from the raw message
      .message = strip_ansi_escape_codes(string!(.message))
      structured = parse_syslog!(.message)
      del(.label)
      . = merge(., structured)

sinks:
  unix_socket_sink:
    inputs:
      - "remap_ubuntu_logs"
    type: "socket"
    mode: "unix"
    path: "/tmp/agentv/agentv.sock"
    encoding:
      codec: "json"
